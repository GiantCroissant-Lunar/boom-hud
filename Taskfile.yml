version: "3"

vars:
  SLN_PATH: dotnet/BoomHud.sln
  UNIFY: dotnet tool run unify-build --
  GITVERSION_JSON: bash tools/gitversion.sh

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ============================================================================
  # Build / Pack / Test (routes through unify-build)
  # ============================================================================

  setup:
    desc: Restore dotnet tools
    cmds:
      - dotnet tool restore

  build:
    desc: Build the solution via unify-build
    deps: [setup]
    cmds:
      - '{{.UNIFY}} Compile'

  pack:
    desc: Create NuGet packages (version from GitVersion)
    deps: [setup]
    cmds:
      - '{{.UNIFY}} PackProjects'
    env:
      GITVERSION_MAJORMINORPATCH:
        sh: '{{.GITVERSION_JSON}} | python -c "import sys,json;print(json.load(sys.stdin)[''MajorMinorPatch''])"'

  test:
    desc: Run all tests
    cmds:
      - dotnet test {{.SLN_PATH}}

  version:
    desc: Show computed version
    deps: [setup]
    cmds:
      - '{{.GITVERSION_JSON}} | python -c "import sys,json;d=json.load(sys.stdin);print(d[''FullSemVer''])"'

  changelog:
    desc: Generate changelog from conventional commits
    cmds:
      - git-cliff --offline -o CHANGELOG.md

  # ============================================================================
  # Agent sync
  # ============================================================================

  agent:sync:
    desc: Sync .agent/ content to all adapters via the workspace sync-project.py
    cmds:
      - python tools/sync-agent-resources.py

  agent:sync:check:
    desc: Dry-run agent sync — report drift without writing
    cmds:
      - python tools/sync-agent-resources.py --check

  # Legacy per-area sync tasks (sync_skills.py etc.) have been retired; the
  # workspace sync-project.py handles skills + rules + per-adapter materialization
  # in a single pass. See tools/sync-agent-resources.py for the wrapper.

  # ============================================================================
  # DTO Generation (schema → quicktype → *.g.cs)
  # ============================================================================

  generate:dto:
    desc: Regenerate all DTOs from JSON schemas using quicktype
    deps:
      - generate:dto:compose
      - generate:dto:motion
      - generate:dto:states
      - generate:dto:tokens

  generate:dto:compose:
    desc: Generate ComposeManifestDto from compose.schema.json
    cmds:
      - >-
        npx quicktype@23.0.170
        --src schemas/json/compose.schema.json
        --src-lang schema
        --lang csharp
        --namespace BoomHud.Abstractions.Composition.Generated
        --features complete
        --array-type list
        --any-type object
        --no-combine-classes
        --out dotnet/src/BoomHud.Abstractions/Composition/Generated/ComposeManifestDto.g.cs
    sources:
      - schemas/json/compose.schema.json
    generates:
      - dotnet/src/BoomHud.Abstractions/Composition/Generated/ComposeManifestDto.g.cs

  generate:dto:motion:
    desc: Generate MotionDocumentDto from motion.schema.json
    cmds:
      - >-
        npx quicktype@23.0.170
        --src schemas/json/motion.schema.json
        --src-lang schema
        --lang csharp
        --framework SystemTextJson
        --top-level MotionDocumentDto
        --namespace BoomHud.Abstractions.Motion.Generated
        --features complete
        --array-type list
        --any-type object
        --no-combine-classes
        --out dotnet/src/BoomHud.Abstractions/Motion/Generated/MotionDocumentDto.g.cs
    sources:
      - schemas/json/motion.schema.json
    generates:
      - dotnet/src/BoomHud.Abstractions/Motion/Generated/MotionDocumentDto.g.cs

  generate:dto:states:
    desc: Generate StatesManifestDto from states.schema.json
    cmds:
      - >-
        npx quicktype@23.0.170
        --src schemas/json/states.schema.json
        --src-lang schema
        --lang csharp
        --namespace BoomHud.Abstractions.Snapshots.Generated
        --features complete
        --array-type list
        --any-type object
        --no-combine-classes
        --out dotnet/src/BoomHud.Abstractions/Snapshots/Generated/StatesManifestDto.g.cs
    sources:
      - schemas/json/states.schema.json
    generates:
      - dotnet/src/BoomHud.Abstractions/Snapshots/Generated/StatesManifestDto.g.cs

  generate:dto:tokens:
    desc: Generate TokensDto from tokens.schema.json
    cmds:
      - >-
        npx quicktype@23.0.170
        --src schemas/json/tokens.schema.json
        --src-lang schema
        --lang csharp
        --namespace BoomHud.Abstractions.Tokens.Generated
        --features complete
        --array-type list
        --any-type object
        --no-combine-classes
        --out dotnet/src/BoomHud.Abstractions/Tokens/Generated/TokensDto.g.cs
    sources:
      - schemas/json/tokens.schema.json
    generates:
      - dotnet/src/BoomHud.Abstractions/Tokens/Generated/TokensDto.g.cs

  generate:runtime-surface:ts:
    desc: Generate Remotion runtime-surface TypeScript types from JSON schemas using quicktype
    cmds:
      - npm --prefix remotion run generate:runtime-surface-types
    sources:
      - schemas/json/runtime-surface.schema.json
      - schemas/json/runtime-node-graph.schema.json
    generates:
      - remotion/src/runtime-surface/types.generated.ts
      - remotion/src/runtime-surface/node-graph.generated.ts

  # ============================================================================
  # CI Verification
  # ============================================================================

  verify:no-dto-leak:
    desc: Verify CLI does not reference Generated namespaces
    cmds:
      - pwsh -NoProfile -File scripts/verify-no-dto-leak.ps1

  verify:package-graph:
    desc: Verify split-ready package IDs and NuGet dependency graph
    cmds:
      - pwsh -NoProfile -File scripts/verify-package-graph.ps1

  verify:test-graph:
    desc: Verify Foundation/backend test ownership and project references
    cmds:
      - pwsh -NoProfile -File scripts/verify-test-graph.ps1

  verify:fidelity:first-pass:
    desc: Run the first-pass Pen → Remotion → Unity fidelity workflow
    cmds:
      - pwsh -NoProfile -File scripts/run-pen-remotion-unity-fidelity.ps1

  verify:fidelity:corpus:
    desc: Run the component fidelity corpus and enforce the current quality floor
    cmds:
      - pwsh -NoProfile -File scripts/run-fidelity-corpus.ps1
